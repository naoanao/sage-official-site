    <!-- Open Graph -->

    <!-- Twitter / X Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Sage AI — Your AI Posts to Social Media While You Sleep" />
    <meta name="twitter:description" content="Runs 24/7 on Cloudflare. Auto-posts daily to Bluesky & Instagram. No PC needed. $20/mo." />

    <!-- Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "Sage AI",
      "description": "Autonomous AI system that auto-posts to social media daily, runs 24/7 on Cloudflare — no PC required.",
      "applicationCategory": "BusinessApplication",
      "operatingSystem": "Web",
      "offers": [
        { "@type": "Offer", "name": "Pro", "price": "20", "priceCurrency": "USD" },
        { "@type": "Offer", "name": "Enterprise", "price": "99", "priceCurrency": "USD" }
      ],
      "url": "https://sage-ai.pages.dev"
    }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&family=Fira+Code:wght@300..700&display=swap"
        rel="stylesheet">
    <style>
        body { background-color: #F4F8FF; color: #0D1B35; margin: 0; font-family: 'Outfit', sans-serif; }
        @keyframes _sage-spin { to { transform: rotate(360deg); } }
        #_sage-loader {
            position: fixed; inset: 0; background: #F4F8FF;
            display: flex; align-items: center; justify-content: center;
            z-index: 9999; transition: opacity 0.2s;
        }
        #_sage-loader .ring {
            width: 36px; height: 36px; border-radius: 50%;
            border: 3px solid #dde6f5; border-top-color: #1A56DB;
            animation: _sage-spin 0.7s linear infinite;
            will-change: transform;
        }
    </style>
</head>

<body>
    <div id="_sage-loader"><div class="ring"></div></div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
        // Hide the pre-React loader once the app mounts (MutationObserver watches #root)
        (function () {
            var loader = document.getElementById('_sage-loader');
            if (!loader) return;
            var obs = new MutationObserver(function () {
                var root = document.getElementById('root');
                if (root && root.firstChild) {
                    loader.style.opacity = '0';
                    loader.style.pointerEvents = 'none';
                    setTimeout(function () { loader.remove(); }, 200);
                    obs.disconnect();
                }
            });
            obs.observe(document.getElementById('root') || document.body, { childList: true, subtree: true });
        })();
    </script>
</body>

</html>
