<!doctype html>
<html lang="en" class="dark">

<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sage AI — Autonomous Income System</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&family=Fira+Code:wght@300..700&display=swap"
        rel="stylesheet">
    <style>
        body {
            background-color: #0A0F1E;
            color: #0D1B35;
            margin: 0;
            font-family: 'Outfit', sans-serif;
        }
        #splash {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #0A0F1E;
            z-index: 9999;
            gap: 16px;
            transition: opacity 0.3s ease;
        }
        #splash.hidden { opacity: 0; pointer-events: none; }
        #splash-spinner {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            border: 3px solid #1A56DB;
            border-top-color: transparent;
            animation: splash-spin 0.8s linear infinite;
        }
        #splash-text {
            color: #64748b;
            font-size: 14px;
            font-family: monospace;
            letter-spacing: 0.05em;
        }
        @keyframes splash-spin { to { transform: rotate(360deg); } }
    </style>
</head>

<body class="bg-black">
    <div id="splash">
        <div id="splash-spinner"></div>
        <span id="splash-text">Loading Sage...</span>
    </div>
    <div id="root"></div>
    <script>
        // Hide splash once React mounts
        window.__hideSplash = function() {
            var s = document.getElementById('splash');
            if (s) { s.classList.add('hidden'); setTimeout(function(){ s.remove(); }, 350); }
        };
    </script>
    <script type="module" src="/src/main.jsx"></script>
</body>

</html>
