name: D1 Knowledge Loop (Mock)
on:
  push:
    branches: [main, ci/final-test-branch]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      SAGE_MOCK: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run mock test (SAGE_MOCK=1 - サーバー起動不要)
        run: python test_pilot_pipeline.py
