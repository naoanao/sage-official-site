name: SNS Auto Post (Bluesky + Instagram)

on:
  schedule:
    # 1日1回に削減（無料枠をGrowl優先で温存）: 日本時間 20:00 (UTC 11:00)
    - cron: '0 11 * * *'   # JST 20:00
  workflow_dispatch:        # 手動実行ボタン（テスト用）

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        # SNSサイクル(run_sns_cycle.py → backend.scheduler.sns_daily_scheduler)が実際に必要とする
        # 最小依存のみをインストールする。以前は backend/requirements.txt も best-effort で入れていたが、
        # anyio 等の依存コンフリクト(ResolutionImpossible)で毎回失敗し、何もインストールできず、
        # ログに ERROR を出すだけで投稿には不要だった(最小依存だけで成功している)。
        # 重い解決処理を外すことで実行が速く・ログがクリーン・将来の解決失敗による不安定化も排除。
        run: |
          pip install groq atproto requests python-dotenv tweepy notion-client pillow

      - name: Run SNS cycle
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
          SAGE_ENABLE_BLUESKY: 'true'
          SAGE_ENABLE_INSTAGRAM: 'true'
          SAGE_DRY_RUN: 'false'
          SAGE_QUALITY_GATE_STRICT: 'true'
        run: python scripts/run_sns_cycle.py
