name: SNS Auto Post (Bluesky + Instagram)

on:
  schedule:
    # 毎日3回投稿: 日本時間 8:00 / 12:00 / 20:00 (UTC 23:00 / 03:00 / 11:00)
    - cron: '0 23 * * *'   # JST 8:00
    - cron: '0 3 * * *'    # JST 12:00
    - cron: '0 11 * * *'   # JST 20:00
  workflow_dispatch:        # 手動実行ボタン（テスト用）

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install groq atproto requests python-dotenv tweepy notion-client pillow
          if [ -f backend/requirements.txt ]; then pip install -r backend/requirements.txt || true; fi

      - name: Run SNS cycle
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
          SAGE_ENABLE_BLUESKY: 'true'
          SAGE_ENABLE_INSTAGRAM: 'true'
          SAGE_DRY_RUN: 'false'
          SAGE_QUALITY_GATE_STRICT: 'true'
        run: |
          python -c "
          import os, sys
          sys.path.insert(0, '.')
          from backend.scheduler.sns_daily_scheduler import SNSDailyScheduler
          s = SNSDailyScheduler(