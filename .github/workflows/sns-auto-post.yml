name: SNS Auto Post (Bluesky + Instagram)

on:
  schedule:
    - cron: "0 23 * * *"
    - cron: "0 3 * * *"
    - cron: "0 11 * * *"
  workflow_dispatch:

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install groq atproto requests python-dotenv tweepy notion-client pillow
      - name: Run SNS cycle
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
          SAGE_ENABLE_BLUESKY: "true"
          SAGE_ENABLE_INSTAGRAM: "true"
          SAGE_DRY_RUN: "false"
          SAGE_QUALITY_GATE_STRICT: "true"
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/run_sns_cycle.py
