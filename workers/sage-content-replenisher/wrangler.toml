name               = "sage-content-replenisher"
main               = "index.js"
compatibility_date = "2024-01-01"
account_id         = "YOUR_CLOUDFLARE_ACCOUNT_ID"   # ← Replace with your CF Account ID

# Cron: Every Sunday 20:00 JST (= 11:00 UTC)
[triggers]
crons = ["0 11 * * SUN"]

# ─────────────────────────────────────────────────────────────
# SETUP INSTRUCTIONS
# Set secrets once after deploying:
#   wrangler secret put NOTION_API_KEY
#   wrangler secret put GROQ_API_KEY
#   wrangler secret put TELEGRAM_BOT_TOKEN   (optional)
#
# Then deploy:
#   wrangler deploy
# ─────────────────────────────────────────────────────────────

# Plain vars (non-secret):
[vars]
NOTION_CONTENT_POOL_DB_ID = "YOUR_NOTION_DATABASE_ID"   # ← 32-char ID from your Notion DB URL
TELEGRAM_CHAT_ID          = "YOUR_TELEGRAM_CHAT_ID"     # ← Optional: get from @userinfobot
NOTION_STATUS_PENDING     = "Scheduled"                  # ← Must match Status value in your Notion DB
