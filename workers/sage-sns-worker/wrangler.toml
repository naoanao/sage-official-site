name       = "sage-sns-worker"
main       = "index.js"
compatibility_date = "2024-01-01"
account_id = "9a00225a365387adfb3b047cbadd38de"

# Cron Trigger: 毎日 09:00 JST (= 00:00 UTC)
[triggers]
crons = ["0 0 * * *"]

# Env vars are set in CF Dashboard or via:
#   wrangler secret put NOTION_API_KEY
#   wrangler secret put GROQ_API_KEY
#   wrangler secret put BLUESKY_APP_PASSWORD
#   wrangler secret put INSTAGRAM_ACCESS_TOKEN
#   wrangler secret put TELEGRAM_BOT_TOKEN
# Plain vars:
#   wrangler vars set BLUESKY_HANDLE "kanagawajapan.bsky.social"
#   wrangler vars set INSTAGRAM_ACCOUNT_ID "17841480111989457"
#   wrangler vars set NOTION_CONTENT_POOL_DB_ID "b4f36b500abc45a28c08f5d59463d8cc"
#   wrangler vars set TELEGRAM_CHAT_ID "778654915"

[vars]
BLUESKY_HANDLE              = "kanagawajapan.bsky.social"
INSTAGRAM_ACCOUNT_ID        = "17841480111989457"
NOTION_CONTENT_POOL_DB_ID   = "b4f36b500abc45a28c08f5d59463d8cc"
TELEGRAM_CHAT_ID            = "778654915"
