name       = "sage-sns-worker"
main       = "index.js"
compatibility_date = "2024-01-01"
account_id = "YOUR_CLOUDFLARE_ACCOUNT_ID"   # ← Replace with your CF Account ID (dash.cloudflare.com → URL)

# Cron Trigger: daily 09:00 JST (= 00:00 UTC)
[triggers]
crons = ["0 0 * * *"]

# ─────────────────────────────────────────────────────────────
# SETUP INSTRUCTIONS
# After editing this file, run the following commands once:
#
# Secrets (sensitive — stored encrypted in Cloudflare):
#   wrangler secret put NOTION_API_KEY
#   wrangler secret put GROQ_API_KEY
#   wrangler secret put BLUESKY_APP_PASSWORD
#   wrangler secret put INSTAGRAM_ACCESS_TOKEN   (optional)
#   wrangler secret put IMGBB_API_KEY            (optional)
#   wrangler secret put TELEGRAM_BOT_TOKEN       (optional)
#
# Then deploy:
#   wrangler deploy
# ─────────────────────────────────────────────────────────────

[vars]
BLUESKY_HANDLE              = "yourhandle.bsky.social"        # ← Your Bluesky handle (no @)
INSTAGRAM_ACCOUNT_ID        = "YOUR_INSTAGRAM_ACCOUNT_ID"     # ← Optional: Instagram Business account ID
NOTION_CONTENT_POOL_DB_ID   = "YOUR_NOTION_DATABASE_ID"       # ← 32-char ID from your Notion DB URL
TELEGRAM_CHAT_ID            = "YOUR_TELEGRAM_CHAT_ID"         # ← Optional: get from @userinfobot
NOTION_STATUS_PENDING       = "Scheduled"                     # ← Must match the Status value in your Notion DB
NOTION_STATUS_DONE          = "Done"                          # ← Status set after posting
